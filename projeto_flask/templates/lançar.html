<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitema de Notas</title>
    <style>
         body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      display: flex;              
      justify-content: center;   
      align-items: center;        
      height: 100vh;              
      margin: 0;                  
    }

    div {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;         
    }

    input, button {
      width: 100%;                
      margin-bottom: 15px;       
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #218838;
    }
</style>

</head>
<body>
<div>
    <h1>Sistema de Lançamento de NF's</h1>
    <p>Numero da NF</p>
    <p><input type="number" text="valor" placeholder="Digite o Nº da NF"></p>
    <button>Lançar NF</button>
</div>

</body>
</html>
